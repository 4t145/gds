[package]
name = "gds"
version = "0.1.0"
edition = "2024"
autobins = false
publish = false
license = "MIT"

[workspace]
members = ["crates/gds-settings-derive"]
resolver = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gds-files"
path = "src/bin/files/main.rs"

[[bin]]
name = "gds-agents"
path = "src/bin/agents/main.rs"
required-features = ["agents"]

[features]
default = []
agents = [
    "dep:bas", "dep:clap", "dep:base64", "dep:jiff", "dep:reqwest",
    "dep:reqwest_client", "dep:serde_json_lenient", "dep:vt100",
    "dep:similar", "dep:markdown", "dep:html5ever",
    "dep:markup5ever_rcdom", "dep:rodio", "dep:futures", "dep:tokio",
    "dep:tokio-util", "dep:tokio-stream", "dep:tonic", "dep:tracing",
    "dep:tracing-subscriber", "dep:uuid", "dep:regex", "dep:sha2", "dep:rustls",
    "gpui-kit/tree-sitter-markdown", "gpui-kit/tree-sitter-rust",
    "gpui-kit/tree-sitter-bash", "gpui-kit/tree-sitter-python",
    "gpui-kit/tree-sitter-typescript", "gpui-kit/tree-sitter-diff",
    "dep:arboard", "dep:png", "dep:dirs", "dep:which",
    "dep:toasty", "dep:toasty-driver-sqlite", "dep:strum", "dep:time", "dep:agent-client-protocol",
    "dep:process-wrap",
]
gui-tests = ["agents", "gpui-kit/test-support"]

[dependencies]
gds-settings-derive = { path = "crates/gds-settings-derive" }
dirs = { version = "6", optional = true }
which = { version = "8", optional = true }
toasty = { version = "=0.11.0", default-features = false, features = ["sqlite", "migration"], optional = true }
toasty-driver-sqlite = { version = "=0.11.0", optional = true }
strum = { version = "0.28", features = ["derive"], optional = true }
time = { version = "0.3", features = ["parsing", "macros"], optional = true }
agent-client-protocol = { version = "=3.3.0", features = ["process", "schemars", "unstable", "unstable_protocol_v2"], optional = true }
bas = { package = "bas-client", git = "https://github.com/4t145/bas", rev = "9ccfcdb960213ba4f506e93241d9bcd78de3a0b4", optional = true }
base64 = { version = "0.22", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"], optional = true }
regex = { version = "1", optional = true }
rodio = { version = "=0.21.1", optional = true, default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "tracing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.10", optional = true }
jiff = { version = "0.2", optional = true }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9", optional = true }
markdown = { version = "=1.0.0", optional = true }
html5ever = { version = "=0.27.0", optional = true }
markup5ever_rcdom = { version = "=0.3.0", optional = true }
vt100 = { version = "0.16", optional = true }
unicode-segmentation = "1"
unicode-width = "0.2"
serde_json_lenient = { version = "0.2", optional = true }
similar = { version = "2", optional = true }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
], optional = true }
tokio-stream = { version = "0.1", features = ["net", "sync"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tonic = { version = "0.14", features = ["tls-ring", "gzip"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["serde", "v4", "v7"], optional = true }
anyhow = "1"
async-channel = "2"
# Published MIT PTY transport and Apache-2.0 terminal emulator; no GPUI forks.
portable-pty = "=0.9.0"
alacritty_terminal = "=0.26.0"
# Same MIT/Apache font discovery library as GPUI; resolve the system monospace alias.
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed" }
chrono = "0.4"
directories = "6"
fluent-bundle = "0.16"
gds-uim = { git = "https://github.com/4t145/gds-uim", rev = "94fe061888c45e137daff0d45c172c36bdb09882" }
# The picker matches raw (possibly non-UTF-8) basenames, so globbing is done on
# `Path` values instead of hand-rolled `String` matching.
globset = "0.4"
gpui-kit = "=0.8.0"
# Header-only dimension/colour probing needs these decoders; every feature here
# is already enabled by GPUI, so the resolved dependency set does not change.
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
infer = { version = "0.19", default-features = false }
mime_guess = "2"
notify = "8"
open = "5"
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
trash = "5.2.9"
unic-langid = "0.9"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "open_uri"] }
async-io = "2"
futures-lite = "2"
zbus = "5.19"
rustix = { version = "1.1", features = ["fs", "event"] }
wl-clipboard-rs = "0.9.4"

[target.'cfg(unix)'.dependencies]
# Owner/group names come from the system NSS interfaces (`getpwuid_r` /
# `getgrgid_r`); we do not parse passwd files ourselves.
nix = { version = "0.31", features = ["user", "fs", "poll", "process", "signal", "term"] }

[profile.dev]
debug = 1

# Prioritize runtime performance, then reduce the shipped binary size.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"
incremental = false

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"], optional = true }

[dev-dependencies]
bas = { package = "bas-client", git = "https://github.com/4t145/bas", rev = "9ccfcdb960213ba4f506e93241d9bcd78de3a0b4", features = ["test-support"] }
# Runtime-generated TLS fixtures for the imported connection tests.
rcgen = "=0.13.2"
rusqlite = "=0.40.2"
tonic-prost = "0.14"
